[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1
test_ignore = test_protocol

; Optional desktop unit tests. Requires GCC/G++ on PATH (MSYS2 on Windows).
[env:native]
platform = native
test_framework = unity
test_filter = test_protocol


